<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chase Elliott - Visual Playground</title>
  <style>
    :root{--bg:#0a0f1a;--card:#11182a;--text:#e8f0ff;--muted:#a8b6d6;--accent:#7bd389}
    *{box-sizing:border-box} html,body{margin:0;height:100%} body{font-family:Inter,Arial,system-ui,sans-serif;background:radial-gradient(circle at 20% -10%, #1b2a4a 0 40%, transparent 40%), #0a0f1a;color:var(--text);} header{position:sticky;top:0;background:rgba(10,12,25,.92);border-bottom:1px solid #2a2a3a}
    .wrap{max-width:980px;margin:0 auto;padding:14px}
    .brand{font-weight:700}
    nav{display:flex;justify-content:space-between;align-items:center}
    .nav-links{display:flex;gap:14px}
    a{color:var(--text);text-decoration:none;padding:6px 10px;border-radius:6px}
    a:hover{background:#1b2a4a}
    .hero{display:grid;grid-template-columns:1.1fr 0.9fr;gap:20px;align-items:center;padding:40px}
    .box{background:var(--card);border-radius:14px;padding:26px}
    h1{font-size:2rem;margin:0 0 8px}
    p{color:var(--muted);line-height:1.6}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
    .dot{height:10px;width:10px;border-radius:50%;background:var(--accent);display:inline-block}
    .btn{display:inline-block;background:var(--accent);color:#062e1a;padding:10px 14px;border-radius:8px;text-decoration:none;font-weight:700}
    @media (max-width: 900px){ .hero{grid-template-columns:1fr; padding:20px} .grid{grid-template-columns:1fr 1fr 1fr} }
    @media (max-width: 520px){ .grid{grid-template-columns:1fr} }
  </style>
</head>
<body>
  <header>
    <div class="wrap" style="display:flex;justify-content:space-between;align-items:center;">
      <div class="brand">Chase Elliott</div>
      <nav>
        <div class="nav-links" aria-label="Navigate to sections">
          <a href="#shots">Shots</a>
          <a href="#about">About</a>
          <a href="#cta">CTA</a>
        </div>
        <div class="menu" onclick="toggleMenu()">menu</div>
      </nav>
    </div>
  </header>
  <main>
    <section class="wrap hero" id="about">
      <div class="box" aria-label="Intro">
        <h1>Visual Playground</h1>
        <p>A tiny canvas of experiments: interactions, gradients, and motion—all in vanilla tech.</p>
        <div style="margin-top:10px"><span class="dot"></span><span class="dot" style="margin-left:6px"></span><span class="dot" style="margin-left:6px"></span></div>
        <a class="btn" href="#shots">Explore Shots</a>
      </div>
      <div class="box" aria-label="Preview grid">
        <div class="grid" id="shots" style="gap:8px;margin-bottom:8px;">
          <div style="height:60px;background:#1a2a3a;border-radius:6px"></div>
          <div style="height:60px;background:#2a3a5a;border-radius:6px"></div>
          <div style="height:60px;background:#324a7a;border-radius:6px"></div>
        </div>
        <button class="btn" onclick="shuffleColors()">Shuffle Palette</button>
      </div>
    </section>
    <section id="cta" class="wrap" style="padding-top:0;">
      <div class="box" style="text-align:center;">
        <h2 style="margin:0 0 6px">Want a quick demo?</h2>
        <p style="margin:0 0 12px">This page showcases clean, library-free UI with interactive color swatches.</p>
        <button class="btn" onclick="alert('Demo only – no data sent.')">Notify Me</button>
      </div>
    </section>
  </main>
  <script>
    function toggleMenu(){ const m=document.querySelector('.nav-links'); m.style.display=m.style.display==='none'? 'flex':'none'; }
    function shuffleColors(){ const hues=["#4cc9f0","#7bd389","#f6b26b","#e76f51","#a78bfa"]; document.documentElement.style.setProperty('--accent', hues[Math.floor(Math.random()*hues.length)]); }
    document.querySelectorAll('a[href^="#"]').forEach(a=>{ a.addEventListener('click',e=>{ e.preventDefault(); document.querySelector(a.getAttribute('href')).scrollIntoView({behavior:'smooth'}); });});
  </script>
</body>
</html>
